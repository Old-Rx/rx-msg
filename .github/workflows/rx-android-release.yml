name: RX Android Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rx-android-release.yml"

permissions:
  contents: read

concurrency:
  group: rx-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Android ARM64 FOSS Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_rxSigningStorePassword: ${{ secrets.RX_ANDROID_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_rxSigningKeyAlias: ${{ secrets.RX_ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_rxSigningKeyPassword: ${{ secrets.RX_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "ndk;23.1.7779620" \
            "cmake;3.22.1"

      - name: Prepare local configuration
        working-directory: apps/multiplatform
        shell: bash
        run: cp local.properties.example local.properties

      - name: Normalize shell scripts
        shell: bash
        run: |
          find . -type f \( -name "*.sh" -o -name "gradlew" \) \
            -exec sed -i 's/\r$//' {} +

      - name: Prepare prebuilt native ARM64 libraries
        shell: bash
        env:
          SIMPLEX_ANDROID_VERSION: v7.0.1
          SIMPLEX_ANDROID_APK_SHA256: d5b37d2eaf92d560181306973f359518b11048e3f69585d56ab5eed53a97f865
        run: |
          set -euo pipefail

          LIBS_DIR="$GITHUB_WORKSPACE/apps/multiplatform/common/src/commonMain/cpp/android/libs/arm64-v8a"
          APK_PATH="$RUNNER_TEMP/simplex-aarch64-${SIMPLEX_ANDROID_VERSION}.apk"

          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$APK_PATH" \
            "https://github.com/simplex-chat/simplex-chat/releases/download/${SIMPLEX_ANDROID_VERSION}/simplex-aarch64.apk"

          echo "${SIMPLEX_ANDROID_APK_SHA256}  ${APK_PATH}" | sha256sum -c -

          mkdir -p "$LIBS_DIR"
          unzip -jo "$APK_PATH" \
            lib/arm64-v8a/libsimplex.so \
            lib/arm64-v8a/libsupport.so \
            -d "$LIBS_DIR"

          test -f "$LIBS_DIR/libsimplex.so"
          test -f "$LIBS_DIR/libsupport.so"

      - name: Restrict release candidate to ARM64
        working-directory: apps/multiplatform
        shell: bash
        run: |
          sed -i.bak \
            's/include(.*/include("arm64-v8a")/' \
            android/build.gradle.kts

          grep -n 'include("arm64-v8a")' android/build.gradle.kts

      - name: Configure optional release signing
        id: signing
        shell: bash
        env:
          RX_ANDROID_KEYSTORE_BASE64: ${{ secrets.RX_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          values=(
            "$RX_ANDROID_KEYSTORE_BASE64"
            "$ORG_GRADLE_PROJECT_rxSigningStorePassword"
            "$ORG_GRADLE_PROJECT_rxSigningKeyAlias"
            "$ORG_GRADLE_PROJECT_rxSigningKeyPassword"
          )
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "label=unsigned" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured; producing an unsigned release candidate."
          elif [[ "$configured" -ne 4 ]]; then
            echo "All four RX_ANDROID_* signing secrets must be configured together." >&2
            exit 1
          else
            KEYSTORE_PATH="$RUNNER_TEMP/rx-msg-release.jks"
            printf '%s' "$RX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "ORG_GRADLE_PROJECT_rxSigningStoreFile=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "label=signed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: apps/multiplatform
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleFossRelease --stacktrace

      - name: Verify and stage release candidate
        id: artifact
        shell: bash
        env:
          SIGNING_LABEL: ${{ steps.signing.outputs.label }}
        run: |
          set -euo pipefail

          mapfile -t release_apks < <(find apps/multiplatform/android/build/outputs/apk \
            -type f -name '*arm64-v8a*release*.apk' | sort)
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            printf 'Expected one ARM64 release APK, found %s:\n' "${#release_apks[@]}" >&2
            printf '%s\n' "${release_apks[@]}" >&2
            exit 1
          fi

          version_name=$(sed -n 's/^android.version_name=//p' apps/multiplatform/gradle.properties | tr -d '\r')
          mkdir -p dist
          output="dist/rx-msg-${version_name}-arm64-${SIGNING_LABEL}.apk"
          cp "${release_apks[0]}" "$output"

          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -z "$apksigner_path" ]]; then
            echo "Android apksigner was not found." >&2
            exit 1
          fi

          if [[ "$SIGNING_LABEL" == "signed" ]]; then
            "$apksigner_path" verify --verbose --print-certs "$output"
          elif "$apksigner_path" verify "$output" >/dev/null 2>&1; then
            echo "Expected an unsigned APK, but signature verification succeeded." >&2
            exit 1
          else
            echo "Confirmed that this release candidate is unsigned."
          fi

          sha256sum "$output" > dist/SHA256SUMS
          echo "name=rx-msg-android-arm64-release-${SIGNING_LABEL}" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rx-msg-release.jks"

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
