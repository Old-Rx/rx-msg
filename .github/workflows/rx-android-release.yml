name: RX Android Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional draft prerelease tag, for example v7.0.1-rx.1"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: rx-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Android ARM64 FOSS Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_rxSigningStorePassword: ${{ secrets.RX_ANDROID_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_rxSigningKeyAlias: ${{ secrets.RX_ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_rxSigningKeyPassword: ${{ secrets.RX_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "ndk;23.1.7779620" \
            "cmake;3.22.1"

      - name: Prepare local configuration
        working-directory: apps/multiplatform
        shell: bash
        run: cp local.properties.example local.properties

      - name: Normalize shell scripts
        shell: bash
        run: |
          find . -type f \( -name "*.sh" -o -name "gradlew" \) \
            -exec sed -i 's/\r$//' {} +

      - name: Prepare prebuilt native ARM64 libraries
        shell: bash
        env:
          SIMPLEX_ANDROID_VERSION: v7.0.1
          SIMPLEX_ANDROID_APK_SHA256: d5b37d2eaf92d560181306973f359518b11048e3f69585d56ab5eed53a97f865
        run: |
          set -euo pipefail

          LIBS_DIR="$GITHUB_WORKSPACE/apps/multiplatform/common/src/commonMain/cpp/android/libs/arm64-v8a"
          APK_PATH="$RUNNER_TEMP/simplex-aarch64-${SIMPLEX_ANDROID_VERSION}.apk"

          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$APK_PATH" \
            "https://github.com/simplex-chat/simplex-chat/releases/download/${SIMPLEX_ANDROID_VERSION}/simplex-aarch64.apk"

          echo "${SIMPLEX_ANDROID_APK_SHA256}  ${APK_PATH}" | sha256sum -c -

          mkdir -p "$LIBS_DIR"
          unzip -jo "$APK_PATH" \
            lib/arm64-v8a/libsimplex.so \
            lib/arm64-v8a/libsupport.so \
            -d "$LIBS_DIR"

          test -f "$LIBS_DIR/libsimplex.so"
          test -f "$LIBS_DIR/libsupport.so"

      - name: Restrict release candidate to ARM64
        working-directory: apps/multiplatform
        shell: bash
        run: |
          sed -i.bak \
            's/include(.*/include("arm64-v8a")/' \
            android/build.gradle.kts

          grep -n 'include("arm64-v8a")' android/build.gradle.kts

      - name: Configure required release signing
        shell: bash
        env:
          RX_ANDROID_KEYSTORE_BASE64: ${{ secrets.RX_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          values=(
            "$RX_ANDROID_KEYSTORE_BASE64"
            "$ORG_GRADLE_PROJECT_rxSigningStorePassword"
            "$ORG_GRADLE_PROJECT_rxSigningKeyAlias"
            "$ORG_GRADLE_PROJECT_rxSigningKeyPassword"
          )
          for value in "${values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "All four RX_ANDROID_* signing secrets are required for release builds." >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/rx-msg-release.jks"
          printf '%s' "$RX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ORG_GRADLE_PROJECT_rxSigningStoreFile=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: apps/multiplatform
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleFossRelease --stacktrace

      - name: Verify and stage release candidate
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          mapfile -t release_apks < <(find apps/multiplatform/android/build/outputs/apk \
            -type f -name '*arm64-v8a*release*.apk' | sort)
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            printf '%s\n' "${release_apks[@]}" >&2
            fail "Expected one ARM64 release APK, found ${#release_apks[@]}."
          fi

          version_name=$(sed -n 's/^android.version_name=//p' apps/multiplatform/gradle.properties | tr -d '\r')
          version_code=$(sed -n 's/^android.version_code=//p' apps/multiplatform/gradle.properties | tr -d '\r')
          mkdir -p dist
          output="dist/rx-msg-${version_name}-arm64-signed.apk"
          cp "${release_apks[0]}" "$output"

          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aapt_path=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [[ -z "$apksigner_path" || -z "$aapt_path" ]]; then
            fail "Android APK inspection tools were not found."
          fi

          verification_output=$("$apksigner_path" verify --verbose --print-certs "$output" 2>&1)
          printf '%s\n' "$verification_output"
          expected_cert_sha256="0c9e5dcabaabe47a7bdec4e90e0ea5877c2f8420f396d376ca5179ee9334df15"
          actual_cert_sha256=$(
            awk 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' <<< "$verification_output" |
              tr -d ':\r' |
              tr '[:upper:]' '[:lower:]'
          )

          badging=$("$aapt_path" dump badging "$output")
          package_line=$(grep -m 1 '^package:' <<< "$badging" || true)
          application_label_line=$(grep -m 1 '^application-label:' <<< "$badging" || true)

          apk_entries=$(unzip -Z1 "$output")
          mapfile -t native_abis < <(
            awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ {print $2}' <<< "$apk_entries" |
              sort -u
          )

          {
            echo "### RX-msg Android release gate"
            echo
            echo "- Package metadata: \`$package_line\`"
            echo "- Application label: \`$application_label_line\`"
            echo "- Native ABIs: \`${native_abis[*]}\`"
            echo "- Signing certificate SHA-256: \`$actual_cert_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$actual_cert_sha256" == "$expected_cert_sha256" ]] ||
            fail "Signing certificate SHA-256 mismatch: expected $expected_cert_sha256, got ${actual_cert_sha256:-not-reported}."
          [[ "$package_line" == *"name='com.oldrx.rxmsg'"* ]] ||
            fail "APK package name is not com.oldrx.rxmsg: $package_line"
          [[ "$package_line" == *"versionCode='$version_code'"* ]] ||
            fail "APK versionCode is not $version_code: $package_line"
          [[ "$package_line" == *"versionName='$version_name'"* ]] ||
            fail "APK versionName is not $version_name: $package_line"
          [[ "$application_label_line" == "application-label:'RX-msg'" ]] ||
            fail "APK application label is not RX-msg: $application_label_line"
          if [[ "${native_abis[*]}" != "arm64-v8a" ]]; then
            fail "Expected only arm64-v8a native libraries, found: ${native_abis[*]}"
          fi
          grep -Fxq 'lib/arm64-v8a/libsimplex.so' <<< "$apk_entries" ||
            fail "APK is missing lib/arm64-v8a/libsimplex.so."
          grep -Fxq 'lib/arm64-v8a/libsupport.so' <<< "$apk_entries" ||
            fail "APK is missing lib/arm64-v8a/libsupport.so."

          sha256sum "$output" > dist/SHA256SUMS
          echo "name=rx-msg-android-arm64-release-signed" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rx-msg-release.jks"

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create or refresh draft prerelease
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rx\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH-rx.NUMBER." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/rx-msg-release-notes.md"
          printf '%s\n' \
            "First RX-msg Android preview, based on the SimpleX Chat 7.0.1 codebase." \
            "" \
            "- FOSS ARM64 APK signed with the RX-msg release identity" \
            "- Android package: com.oldrx.rxmsg" \
            "- RX-msg product name, launcher icon, and product-facing UI" \
            "- Automated checks for package identity, version, ARM64 native libraries, signature certificate, and SHA-256 checksum" \
            "- Source attribution: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/NOTICE.md" \
            "" \
            "This is a draft prerelease pending installation and messaging smoke tests on a physical Android device." \
            > "$notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to modify it." >&2
              exit 1
            fi

            # The Actions artifact uploaded above remains a recoverable copy if refreshing an asset fails.
            gh release upload "$RELEASE_TAG" \
              dist/*.apk \
              dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RX-msg ${RELEASE_TAG#v}" \
              --notes-file "$notes" \
              --draft \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              dist/*.apk \
              dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RX-msg ${RELEASE_TAG#v}" \
              --notes-file "$notes" \
              --draft \
              --prerelease
          fi
