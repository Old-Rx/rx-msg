name: RX Android Baseline

on:
  push:
    branches:
      - main
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/rx-android-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ARM64 FOSS Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "ndk;23.1.7779620" \
            "cmake;3.22.1"

      - name: Prepare local configuration
        working-directory: apps/multiplatform
        shell: bash
        run: |
          cp local.properties.example local.properties

      - name: Normalize shell scripts
        shell: bash
        run: |
          find . -type f \( -name "*.sh" -o -name "gradlew" \) \
            -exec sed -i 's/\r$//' {} +

      - name: Prepare prebuilt native ARM64 libraries
        shell: bash
        env:
          SIMPLEX_ANDROID_VERSION: v7.0.1
          SIMPLEX_ANDROID_APK_SHA256: d5b37d2eaf92d560181306973f359518b11048e3f69585d56ab5eed53a97f865
        run: |
          set -euo pipefail

          LIBS_DIR="$GITHUB_WORKSPACE/apps/multiplatform/common/src/commonMain/cpp/android/libs/arm64-v8a"
          APK_PATH="$RUNNER_TEMP/simplex-aarch64-${SIMPLEX_ANDROID_VERSION}.apk"

          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$APK_PATH" \
            "https://github.com/simplex-chat/simplex-chat/releases/download/${SIMPLEX_ANDROID_VERSION}/simplex-aarch64.apk"

          echo "${SIMPLEX_ANDROID_APK_SHA256}  ${APK_PATH}" | sha256sum -c -

          mkdir -p "$LIBS_DIR"
          unzip -jo "$APK_PATH" \
            lib/arm64-v8a/libsimplex.so \
            lib/arm64-v8a/libsupport.so \
            -d "$LIBS_DIR"

          echo "Native libraries:"
          ls -lah "$LIBS_DIR"

          test -f "$LIBS_DIR/libsimplex.so"
          test -f "$LIBS_DIR/libsupport.so"

      - name: Restrict baseline build to ARM64
        working-directory: apps/multiplatform
        shell: bash
        run: |
          sed -i.bak \
            's/include(.*/include("arm64-v8a")/' \
            android/build.gradle.kts

          grep -n 'include("arm64-v8a")' android/build.gradle.kts

      - name: Build Android APK
        working-directory: apps/multiplatform
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleFossDebug --stacktrace

      - name: Show generated APKs
        shell: bash
        run: |
          find apps/multiplatform/android/build/outputs \
            -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rx-msg-android-arm64-baseline
          path: apps/multiplatform/android/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
