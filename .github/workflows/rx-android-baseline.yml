name: RX Android Baseline

on:
  push:
    branches:
      - main
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/rx-android-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "ndk;23.1.7779620"

      - name: Prepare local build configuration
        working-directory: apps/multiplatform
        shell: bash
        run: cp local.properties.example local.properties

      - name: Normalize shell script line endings
        shell: bash
        run: |
          find . -type f \( -name "*.sh" -o -name "gradlew" \) -exec sed -i 's/\r$//' {} +

      - name: Build FOSS debug APK
        working-directory: apps/multiplatform
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rx-msg-android-baseline
          path: apps/multiplatform/android/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
